<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Work visa illustration with laptop, passport stamp and gear">
<defs>
<linearGradient id="wvBg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#EAF0FF"/>
<stop offset="1" stop-color="#F7E6E4"/>
</linearGradient>
<linearGradient id="wvLaptop" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1B3F93"/>
<stop offset="1" stop-color="#0F2557"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#wvBg)"/>
<!-- gear -->
<g fill="#E4222A" opacity="0.9">
<circle cx="630" cy="170" r="60"/>
<g stroke="#E4222A" stroke-width="18">
<line x1="630" y1="90" x2="630" y2="115"/>
<line x1="630" y1="225" x2="630" y2="250"/>
<line x1="550" y1="170" x2="575" y2="170"/>
<line x1="685" y1="170" x2="710" y2="170"/>
<line x1="573" y1="113" x2="590" y2="130"/>
<line x1="670" y1="210" x2="687" y2="227"/>
<line x1="687" y1="113" x2="670" y2="130"/>
<line x1="590" y1="210" x2="573" y2="227"/>
</g>
<circle cx="630" cy="170" r="24" fill="#F7E6E4"/>
</g>
<line x1="70" y1="470" x2="740" y2="470" stroke="#B9C4D0" stroke-width="4"/>
<!-- laptop -->
<g transform="translate(150,300)">
<rect x="0" y="0" width="260" height="160" rx="10" fill="url(#wvLaptop)"/>
<rect x="16" y="16" width="228" height="128" rx="4" fill="#EAF0FF"/>
<rect x="34" y="34" width="150" height="12" rx="4" fill="#1B3F93"/>
<rect x="34" y="56" width="190" height="10" rx="4" fill="#B9C4D0"/>
<rect x="34" y="76" width="170" height="10" rx="4" fill="#B9C4D0"/>
<rect x="34" y="96" width="120" height="26" rx="6" fill="#E4222A"/>
<polygon points="-24,190 284,190 260,160 0,160" fill="#0F2557"/>
</g>
<!-- ID badge / passport stamp -->
<g transform="translate(470,330)">
<rect width="150" height="190" rx="16" fill="#FFFFFF" stroke="#1B3F93" stroke-width="4"/>
<circle cx="75" cy="60" r="34" fill="#F2A93C"/>
<rect x="35" y="110" width="80" height="10" rx="5" fill="#B9C4D0"/>
<rect x="45" y="130" width="60" height="8" rx="4" fill="#B9C4D0"/>
</g>
<g transform="translate(560,420) rotate(-14)">
<circle r="42" fill="none" stroke="#1E8E52" stroke-width="6"/>
<text x="0" y="6" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1E8E52">APPROVED</text>
</g>
</svg>
