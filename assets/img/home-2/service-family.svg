<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Family visa illustration with parents, child and home">
<defs>
<linearGradient id="fvBg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#EAF0FF"/>
<stop offset="1" stop-color="#F7E6E4"/>
</linearGradient>
<linearGradient id="fvRoof" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E4222A"/>
<stop offset="1" stop-color="#B81A21"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#fvBg)"/>
<!-- house -->
<g>
<rect x="480" y="300" width="220" height="180" fill="#FFFFFF" stroke="#1B3F93" stroke-width="4"/>
<polygon points="470,300 590,210 710,300" fill="url(#fvRoof)"/>
<rect x="560" y="380" width="60" height="100" fill="#1B3F93"/>
<rect x="500" y="330" width="40" height="40" fill="#EAF0FF" stroke="#1B3F93" stroke-width="4"/>
<rect x="640" y="330" width="40" height="40" fill="#EAF0FF" stroke="#1B3F93" stroke-width="4"/>
<circle cx="592" cy="432" r="4" fill="#F2A93C"/>
</g>
<!-- heart above house -->
<path d="M590 150 c-16-20 -48-6 -48 18 c0 26 48 48 48 48 s48-22 48-48 c0-24 -32-38 -48-18z" fill="#E4222A"/>
<!-- family figures -->
<g>
<!-- parent 1 -->
<circle cx="150" cy="330" r="30" fill="#1B3F93"/>
<rect x="118" y="362" width="64" height="110" rx="24" fill="#1B3F93"/>
<!-- parent 2 -->
<circle cx="240" cy="330" r="30" fill="#E4222A"/>
<rect x="208" y="362" width="64" height="110" rx="24" fill="#E4222A"/>
<!-- child -->
<circle cx="195" cy="370" r="20" fill="#F2A93C"/>
<rect x="173" y="392" width="44" height="80" rx="18" fill="#F2A93C"/>
</g>
<!-- ground line -->
<line x1="80" y1="480" x2="740" y2="480" stroke="#B9C4D0" stroke-width="4"/>
<!-- suitcase -->
<g transform="translate(330,420)">
<rect width="90" height="60" rx="8" fill="#0F2557"/>
<rect x="28" y="-14" width="34" height="18" rx="6" fill="none" stroke="#0F2557" stroke-width="6"/>
<rect x="10" y="20" width="70" height="8" fill="#B9C4D0"/>
</g>
</svg>
