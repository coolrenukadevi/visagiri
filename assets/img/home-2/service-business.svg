<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Business visa illustration with briefcase and city skyline">
<defs>
<linearGradient id="bvBg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#EAF0FF"/>
<stop offset="1" stop-color="#F7E6E4"/>
</linearGradient>
<linearGradient id="bvCase" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E4222A"/>
<stop offset="1" stop-color="#B81A21"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bvBg)"/>
<!-- city skyline -->
<g fill="#1B3F93">
<rect x="90" y="260" width="70" height="220"/>
<rect x="170" y="200" width="60" height="280"/>
<rect x="240" y="300" width="55" height="180"/>
<rect x="610" y="230" width="65" height="250"/>
<rect x="685" y="290" width="55" height="190"/>
</g>
<g fill="#EAF0FF">
<rect x="105" y="280" width="14" height="14"/><rect x="130" y="280" width="14" height="14"/>
<rect x="105" y="310" width="14" height="14"/><rect x="130" y="310" width="14" height="14"/>
<rect x="105" y="340" width="14" height="14"/><rect x="130" y="340" width="14" height="14"/>
<rect x="185" y="220" width="14" height="14"/><rect x="210" y="220" width="14" height="14"/>
<rect x="185" y="250" width="14" height="14"/><rect x="210" y="250" width="14" height="14"/>
<rect x="185" y="280" width="14" height="14"/><rect x="210" y="280" width="14" height="14"/>
<rect x="625" y="250" width="14" height="14"/><rect x="650" y="250" width="14" height="14"/>
<rect x="625" y="280" width="14" height="14"/><rect x="650" y="280" width="14" height="14"/>
</g>
<line x1="60" y1="480" x2="760" y2="480" stroke="#B9C4D0" stroke-width="4"/>
<!-- rising chart -->
<polyline points="330,460 400,400 460,430 540,340" fill="none" stroke="#1E8E52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="540,340 570,336 552,364" fill="#1E8E52"/>
<!-- briefcase -->
<g transform="translate(330,420)">
<rect x="20" y="-30" width="70" height="30" rx="8" fill="none" stroke="url(#bvCase)" stroke-width="8"/>
<rect width="220" height="140" rx="14" fill="url(#bvCase)"/>
<rect x="90" y="50" width="40" height="26" rx="6" fill="#FCE3E3"/>
<line x1="0" y1="60" x2="220" y2="60" stroke="#B81A21" stroke-width="4"/>
</g>
</svg>
