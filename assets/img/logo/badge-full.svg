<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visa Agency badge">
<defs>
<linearGradient id="ringGradFull" x1="30" y1="30" x2="210" y2="210" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#073B37"/>
<stop offset="0.5" stop-color="#0EA5A0"/>
<stop offset="1" stop-color="#F0A93E"/>
</linearGradient>
<clipPath id="badgeClipFull">
<circle cx="120" cy="120" r="97"/>
</clipPath>
<filter id="badgeShadowFull" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#031A17" flood-opacity="0.35"/>
</filter>
</defs>

<circle cx="120" cy="120" r="107" fill="#FFFFFF"/>
<circle cx="120" cy="120" r="107" stroke="url(#ringGradFull)" stroke-width="5"/>

<g clip-path="url(#badgeClipFull)">
<rect x="-30" y="46" width="300" height="70" fill="#0EA5A0" transform="rotate(-9 120 81)"/>
<rect x="-30" y="120" width="300" height="70" fill="#0B6E67" transform="rotate(-9 120 155)"/>
</g>

<g filter="url(#badgeShadowFull)">
<text x="120" y="93" font-family="'Space Grotesk', Arial, 'Helvetica Neue', sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" transform="rotate(-9 120 93)">VISA</text>
<text x="120" y="167" font-family="'Space Grotesk', Arial, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" transform="rotate(-9 120 167)">AGENCY</text>
</g>
</svg>
